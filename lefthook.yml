commit-msg:
    jobs:
        - name: commitlint
          run: pnpm exec commitlint --edit {1}

pre-commit:
    piped: true
    skip:
        - merge
        - rebase
    jobs:
        - name: prettier
          glob: ["{2014,2024}/**/*.js", "tools/**/*.{mjs,json}", "*.{json,jsonc,yml,yaml,mjs}"]
          run: pnpm exec prettier --write --ignore-unknown {staged_files}
          stage_fixed: true
        # ! No glob or file list, because the tool reads staged deletions from git and lefthook leaves them out
        - name: bundle
          run: node tools/bundle/src/cli.mjs --staged
        - name: validate
          glob: ["{2014,2024}/**/*.js"]
          run: node tools/validate/src/cli.mjs {staged_files}
        - name: eslint
          glob: ["tools/**/*.mjs", "*.mjs"]
          run: pnpm exec eslint {staged_files}
        - name: markdownlint
          glob: ["*.md", "**/*.md"]
          run: pnpm exec markdownlint-cli2 {staged_files}

pre-push:
    jobs:
        - name: lint
          run: pnpm run lint
        - name: format
          run: pnpm run format:check
        - name: bundle
          run: pnpm run bundle:check
        - name: validate
          run: pnpm run validate
        - name: test
          glob: ["tools/**"]
          run: pnpm test
